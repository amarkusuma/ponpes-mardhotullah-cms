name: CI

# Cek setiap push/PR: install, type-check, dan build Next.js.
# Push ke main yang lolos CI akan memicu "Build & Push Images" di repo infrastructure
# (butuh secret INFRA_DISPATCH_TOKEN; kalau belum diisi, langkah ini dilewati).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Sama dengan default build-arg di Dockerfile
      API_BASE_URL: http://ponpes-backend:8080/api
      NEXT_PUBLIC_API_BASE_URL: /api/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Type-check
        run: yarn tsc --noEmit

      - name: Build
        run: yarn build

  trigger-build:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch build ke repo infrastructure
        env:
          TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          REPO: ${{ github.repository_owner }}/ponpes-mardhotullah-infrastructure
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::INFRA_DISPATCH_TOKEN belum diisi, build image dilewati"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/dispatches" \
            -d "{\"event_type\":\"build\",\"client_payload\":{\"service\":\"cms\",\"ref\":\"$GITHUB_REF_NAME\"}}"
